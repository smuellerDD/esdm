name: Nix

# The kernel side of the flake, against every kernel the pinned nixpkgs
# packages (flake.nix: stockKernels): per kernel, the esdm_es and esdm_cdev
# modules, with the warnings of W=1 as errors, and on x86_64-linux the NixOS VM
# tests of the kernel: live_* boots the ESDM patched kernel with esdm_es,
# cdev_* the stock one with esdm_cdev, ebpf_* the stock one with the eBPF
# entropy sources. On aarch64-linux only the modules are built: its runners
# have no KVM, and the VM tests would run emulated.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every kernel job builds a kernel: the builds of a pull request that got a
# new push are only in the way of those of the new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  list:
    name: list outputs
    runs-on: ubuntu-latest
    outputs:
      kernels: ${{ steps.list.outputs.kernels }}
      kernels-aarch64: ${{ steps.list.outputs.kernels-aarch64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: List the kernels
        id: list
        run: |
          attrs() {
            nix eval --json ".#$1" --apply builtins.attrNames
          }
          packages=$(attrs packages.x86_64-linux)
          checks=$(attrs checks.x86_64-linux)
          packages_aarch64=$(attrs packages.aarch64-linux)

          # The kernels of a system are the suffixes of its module outputs,
          # e.g. esdm_es_6_18 and esdm_cdev_6_18 -> 6_18.
          kernels_of() {
            jq -c '[ .[] | capture("^esdm_(es|cdev)_(?<k>.+)$").k ] | unique'
          }
          kernels=$(kernels_of <<<"$packages")
          kernels_aarch64=$(kernels_of <<<"$packages_aarch64")

          for list in "$kernels" "$kernels_aarch64"; do
            if [ "$(jq 'length' <<<"$list")" -eq 0 ]; then
              echo "::error::no esdm_es_* or esdm_cdev_* outputs in .#packages"
              exit 1
            fi
          done

          # Each kernel has both modules, and on x86_64-linux its three VM
          # tests - a kernel job would fail on a missing one only after its
          # kernel build.
          missing=$(jq -rn --argjson k "$kernels" --argjson p "$packages" \
                           --argjson c "$checks" \
                           --argjson ka "$kernels_aarch64" \
                           --argjson pa "$packages_aarch64" '
            [ ($k[] | (["esdm_es_\(.)", "esdm_cdev_\(.)"] - $p),
                      (["live_\(.)", "cdev_\(.)", "ebpf_\(.)"] - $c)
                    | .[] | "x86_64-linux.\(.)"),
              ($ka[] | (["esdm_es_\(.)", "esdm_cdev_\(.)"] - $pa)
                     | .[] | "aarch64-linux.\(.)") ]
            | join(" ")')
          if [ -n "$missing" ]; then
            echo "::error::missing outputs: $missing"
            exit 1
          fi

          echo "x86_64-linux kernels: $(jq -r 'join(" ")' <<<"$kernels")"
          echo "aarch64-linux kernels: $(jq -r 'join(" ")' <<<"$kernels_aarch64")"
          {
            echo "kernels=$kernels"
            echo "kernels-aarch64=$kernels_aarch64"
          } >> "$GITHUB_OUTPUT"

  kernel:
    name: x86_64-linux / ${{ matrix.kernel }}
    runs-on: ubuntu-latest
    needs: list
    # Builds the ESDM patched kernel from source before esdm_es.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.list.outputs.kernels) }}
    env:
      KERNEL: ${{ matrix.kernel }}
    steps:
      # The kernel is built with the full debug information of nixpkgs'
      # configuration (DEBUG_INFO without DEBUG_INFO_REDUCED), into a build
      # tree of many gigabytes, while GitHub promises its runners 14 GB of
      # free disk only. None of the SDKs removed here is used.
      - name: Make room for the kernel build
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift
          df -h /

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Nix only advertises kvm if /dev/kvm existed at daemon start.
            system-features = nixos-test benchmark big-parallel kvm

      # /dev/kvm is root-only on the runners; without this QEMU uses TCG.
      - name: Enable KVM for the unprivileged builder
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The stock kernel comes from the binary cache, so the esdm_cdev and
      # ebpf parts are done long before the patched kernel is built. Each step
      # runs whether the ones before it failed or not: they test different
      # things.
      - name: Build esdm_cdev
        run: |
          nix build --no-link --print-build-logs ".#esdm_cdev_${KERNEL}"
          # The kernel's modules_install may compress it (esdm_cdev.ko.xz).
          ko=$(find "$(nix path-info ".#esdm_cdev_${KERNEL}")" \
            -name 'esdm_cdev.ko*' | head -n 1)
          if [ -z "$ko" ]; then
            echo "::error::no esdm_cdev.ko in esdm_cdev_${KERNEL}"
            exit 1
          fi
          ls -l "$ko"
          nix shell nixpkgs#kmod -c modinfo "$ko"

      - name: Boot the esdm_cdev VM test
        if: ${{ !cancelled() }}
        run: |
          nix build --no-link --print-build-logs \
            ".#checks.x86_64-linux.cdev_${KERNEL}"

      - name: Boot the eBPF VM test
        if: ${{ !cancelled() }}
        run: |
          nix build --no-link --print-build-logs \
            ".#checks.x86_64-linux.ebpf_${KERNEL}"

      - name: Build esdm_es
        id: esdm_es
        if: ${{ !cancelled() }}
        run: |
          nix build --no-link --print-build-logs ".#esdm_es_${KERNEL}"
          ko=$(find "$(nix path-info ".#esdm_es_${KERNEL}")" \
            -name 'esdm_es.ko*' | head -n 1)
          if [ -z "$ko" ]; then
            echo "::error::no esdm_es.ko in esdm_es_${KERNEL}"
            exit 1
          fi
          ls -l "$ko"
          nix shell nixpkgs#kmod -c modinfo "$ko"

      # Not after a failed esdm_es: that is most likely the patched kernel,
      # which this would build for hours once more.
      - name: Boot the esdm_es VM test
        if: ${{ !cancelled() && steps.esdm_es.outcome == 'success' }}
        run: |
          nix build --no-link --print-build-logs \
            ".#checks.x86_64-linux.live_${KERNEL}"

  kernel-aarch64:
    name: aarch64-linux / ${{ matrix.kernel }}
    runs-on: ubuntu-24.04-arm
    needs: list
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.list.outputs.kernels-aarch64) }}
    env:
      KERNEL: ${{ matrix.kernel }}
    steps:
      # See the x86_64-linux job
      - name: Make room for the kernel build
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift
          df -h /

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build esdm_cdev
        run: |
          nix build --no-link --print-build-logs ".#esdm_cdev_${KERNEL}"
          ko=$(find "$(nix path-info ".#esdm_cdev_${KERNEL}")" \
            -name 'esdm_cdev.ko*' | head -n 1)
          if [ -z "$ko" ]; then
            echo "::error::no esdm_cdev.ko in esdm_cdev_${KERNEL}"
            exit 1
          fi
          ls -l "$ko"
          nix shell nixpkgs#kmod -c modinfo "$ko"

      - name: Build esdm_es
        if: ${{ !cancelled() }}
        run: |
          nix build --no-link --print-build-logs ".#esdm_es_${KERNEL}"
          ko=$(find "$(nix path-info ".#esdm_es_${KERNEL}")" \
            -name 'esdm_es.ko*' | head -n 1)
          if [ -z "$ko" ]; then
            echo "::error::no esdm_es.ko in esdm_es_${KERNEL}"
            exit 1
          fi
          ls -l "$ko"
          nix shell nixpkgs#kmod -c modinfo "$ko"
