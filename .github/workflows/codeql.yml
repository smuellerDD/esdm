name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '26 3 * * 2'

env:
  JENT_REF: refs/tags/v3.7.0

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Kept for the job name and the category earlier results are filed under
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build pkg-config \
                                libprotobuf-c-dev libfuse3-dev libjson-c-dev

    - name: Install Jitter RNG
      run: |
        # Over the image's own copy (26.04 ships 3.6.3): the header and the
        # library linked and loaded must all be this one.
        wget -O jent.tar.gz "https://github.com/smuellerDD/jitterentropy-library/archive/${JENT_REF}.tar.gz"
        mkdir jent
        tar xfz jent.tar.gz -C jent --strip-components=1
        make -C jent
        sudo make -C jent install PREFIX=/usr LIBDIR="lib/$(gcc -print-multiarch)"
        sudo ldconfig
        grep -E 'define JENT_(MAJ|MIN|PATCH)VERSION' /usr/include/jitterentropy.h

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    - name: Meson setup
      run: meson setup build -Dtestmode=enabled -Dselinux=disabled -Dais2031_ntg1=false -Dais2031_drg4=false -Dfips140=true

    - name: Meson compile
      run: meson compile -C build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
