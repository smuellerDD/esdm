/*
 * Protobuf protocol for the unprivileged Unix Domain Socket (i.e. the socket
 * that is accessible by everybody).
 */

syntax = "proto3";

/* EmptyRequest and RetResponse are shared between both protocols. */
import "common.proto";

/******************************************************************************
 * Shared message types
 *
 * Most calls fall into a handful of identical request/response shapes (a
 * return code plus one unsigned value, or a return code plus a byte payload).
 * They share the generic messages below instead of repeating one definition
 * per call. The parameterless EmptyRequest and bare-return-code RetResponse
 * live in common.proto since both protocols use them.
 ******************************************************************************/

/**
 * @brief Response carrying a return code plus a single unsigned value.
 *
 * Used by the calls that report one counter or threshold (entropy level,
 * entropy count, poolsize, write wakeup threshold, min reseed seconds).
 *
 * @param ret Return code (0 on success, < 0 on error)
 * @param val The reported value (semantics depend on the call)
 */
message ValResponse {
	int32 ret = 1;
	uint32 val = 2;
}

/**
 * @brief Response carrying a return code plus a byte payload.
 *
 * Used by the random/seed generation calls. The fast-path encode/decode in
 * esdm_rpc_protocol.c relies on this exact { int64 ret = 1; bytes randval = 2; }
 * layout.
 *
 * @param ret Return code of the generation request (>= 0 on success with the
 *	      value indicating the generated number of bytes, < -255 indicating
 *	      the maximum number of bytes that can be transferred in one
 *	      request, < 0 on error). For RpcGetSeed see esdm_get_seed.
 * @param randval Generated bytes
 */
message RandValResponse {
	int64 ret = 1;
	bytes randval = 2;
}

/**
 * @brief Request to obtain status text.
 *
 * Shared by RpcStatus, RpcStatusJson and RpcJentStatus.
 *
 * A status text longer than maxlen is truncated. The calls rendering JSON
 * answer with -EMSGSIZE and an empty buffer instead: a document cut in half is
 * no JSON document, and a consumer receiving one cannot tell it from what the
 * ESDM meant to send.
 *
 * @param maxlen Maximum size of buffer
 */
message StatusRequest {
	uint32 maxlen = 1;
}

/**
 * @brief Response carrying status text.
 *
 * Shared by RpcStatus, RpcStatusJson and RpcJentStatus.
 *
 * @param ret Return code (0 on success, < 0 on error); if no message buffer is
 *	      returned this value specifies the number of required bytes.
 * @param buffer Buffer with ASCII status - this is a NULL-terminated string
 */
message StatusResponse {
	int32 ret = 1;
	string buffer = 2;
}

/**
 * @brief Request to get random bytes.
 *
 * Shared by RpcGetRandomBytesFull, RpcGetRandomBytesPr and RpcGetRandomBytes.
 *
 * @param len number of random bytes that are requested
 */
message GetRandomBytesRequest {
	uint64 len = 1;
}

/******************************************************************************
 * is_fully_seeded
 ******************************************************************************/

/**
 * @brief Response to get fully seeded status
 *
 * @param ret Return code (0 on success, < 0 on error)
 * @param fully_seeded fully seeded status (true if fully seeded,
 *					   false otherwise)
 */
message IsFullySeededResponse {
	int32 ret = 1;
	bool fully_seeded = 2;
}

/******************************************************************************
 * get_seed
 ******************************************************************************/

/**
 * @brief Request to get seed from entropy sources
 *
 * @param len buffer size provided by caller
 * @param flags the flags field - see esdm_get_seed documentation
 */
message GetSeedRequest {
	uint64 len = 1;
	uint32 flags = 2;
}

/******************************************************************************
 * Write data
 ******************************************************************************/

/**
 * @brief Request to obtain the status of a single DRNG instance.
 *
 * The status document of RpcStatusJson reports the initial and the prediction
 * resistance DRNG only - the node instances follow the number of CPUs and
 * would outgrow the response on a large machine. They are obtained one at a
 * time with this request instead, addressed by the node they serve. A node
 * that has no instance is answered with -ENODEV, and a document that does not
 * fit into maxlen with -EMSGSIZE.
 *
 * @param maxlen Maximum size of buffer
 * @param node Node whose DRNG instance is asked for, ignored when
 *	       prediction_resistance is set
 * @param prediction_resistance Ask for the prediction resistance instance,
 *				which is not bound to a node
 */
message DrngStatusRequest {
	uint32 maxlen = 1;
	uint32 node = 2;
	bool prediction_resistance = 3;
}

/**
 * @brief Request to write data into the auxiliary entropy pool and perform an
 *	  immediate reseed.
 *
 * @param data Buffer with the data to write into the DRNG - the entropy
 *	       estimator will remain unchanged.
 */
message WriteDataRequest {
	bytes data = 1;
}

/******************************************************************************
 * Protocol handler
 ******************************************************************************/
service UnprivAccess {
	/* status calls */
	rpc RpcStatus (StatusRequest) returns (StatusResponse);
	rpc RpcGetEntLvl (EmptyRequest) returns (ValResponse);
	rpc RpcIsFullySeeded (EmptyRequest) returns (IsFullySeededResponse);

	rpc RpcGetRandomBytesFull (GetRandomBytesRequest) returns
				  (RandValResponse);
	rpc RpcGetRandomBytesPr (GetRandomBytesRequest) returns
				(RandValResponse);
	rpc RpcGetRandomBytes (GetRandomBytesRequest) returns (RandValResponse);
	rpc RpcGetSeed (GetSeedRequest) returns (RandValResponse);
	rpc RpcWriteData (WriteDataRequest) returns (RetResponse);

	/* IOCTLs */
	rpc RpcRndGetEntCnt (EmptyRequest) returns (ValResponse);
	/* /proc entry */
	rpc RpcGetPoolsize (EmptyRequest) returns (ValResponse);
	rpc RpcGetWriteWakeupThresh (EmptyRequest) returns (ValResponse);
	rpc RpcGetMinReseedSecs (EmptyRequest) returns (ValResponse);

	/* entropy source specific calls */
	rpc RpcJentStatus (StatusRequest) returns (StatusResponse);

	/*
	 * New calls are appended here: the wire protocol addresses a call by
	 * its index in this list, so inserting one anywhere above would make
	 * an already installed client invoke a different call on the server.
	 */
	rpc RpcStatusJson (StatusRequest) returns (StatusResponse);
	rpc RpcDrngStatusJson (DrngStatusRequest) returns (StatusResponse);
}
