/*
 * Protobuf protocol for the privileged Unix Domain Socket (i.e. the socket
 * that is accessible by root only).
 */

syntax = "proto3";

/* EmptyRequest and RetResponse are shared between both protocols. */
import "common.proto";

/******************************************************************************
 * RNDADDTOENTCNT IOCTL
 ******************************************************************************/

/**
 * @brief Request to change the entropy estimator of the ES manager
 *
 * @param entcnt Entropy value in bits to set to (value is capped to maximum
 *		 possible entropy value)
 */
message RndAddToEntCntRequest {
	uint32 entcnt = 1;
}

/******************************************************************************
 * RNDADDENTROPY IOCTL
 ******************************************************************************/
/**
 * @brief Request to add data to the auxiliary entropy pool and increase the
 *	  pool's entropy estimate accordingly
 *
 * @param randval Buffer with the entropy data
 * @param entcnt Entropy value in bits to set to (value is capped to maximum
 *		 possible entropy value)
 */
message RndAddEntropyRequest {
	bytes randval = 1;
	uint32 entcnt = 2;
}

/******************************************************************************
 * write of write_wakeup_threshold /proc file
 ******************************************************************************/

/**
 * @brief Request to set the available write wakeup threshold
 */
message SetWriteWakeupThreshRequest {
	uint32 wakeup = 1;
}

/******************************************************************************
 * write of urandom_min_reseed_secs /proc file
 ******************************************************************************/

/**
 * @brief Request to set the available write wakeup threshold
 */
message SetMinReseedSecsRequest {
	uint32 seconds = 1;
}

/******************************************************************************
 * Configure the PKCS#11 entropy source (token label and/or user PIN)
 ******************************************************************************/

/**
 * @brief Request to update the runtime configuration of the PKCS#11 entropy
 *	  source.
 *
 * Each field is only applied when its corresponding `set_*` flag is true,
 * which lets callers update only the PIN, only the label, or both atomically.
 *
 * Update order on the server: the token label is applied first (it re-opens
 * the PKCS#11 module against the new label), then the PIN is installed and
 * a login is attempted on the freshly opened slot if the token requires it.
 * If the label update fails, the PIN is not applied.
 *
 * Passing the empty string for `pin` or `token_label` (with the matching
 * `set_*` flag set) clears the runtime override and falls back to the
 * compile-time default.
 *
 * The settings are in-memory only and are not persisted across server
 * restarts.
 *
 * @param set_token_label Apply `token_label` if true.
 * @param token_label PKCS#11 token label to select.
 * @param set_pin Apply `pin` if true.
 * @param pin User PIN to authenticate with the PKCS#11 token (CKU_USER).
 */
message SetPkcs11ConfigRequest {
	bool set_token_label = 1;
	string token_label = 2;
	bool set_pin = 3;
	string pin = 4;
}

/******************************************************************************
 * Protocol handler
 ******************************************************************************/
service PrivAccess {
	rpc RpcRndAddToEntCnt (RndAddToEntCntRequest) returns (RetResponse);
	rpc RpcRndAddEntropy (RndAddEntropyRequest) returns (RetResponse);
	rpc RpcRndClearPool (EmptyRequest) returns (RetResponse);
	rpc RpcRndReseedCRNG (EmptyRequest) returns (RetResponse);

	/* /proc entry */
	rpc RpcSetWriteWakeupThresh (SetWriteWakeupThreshRequest) returns
				    (RetResponse);
	rpc RpcSetMinReseedSecs (SetMinReseedSecsRequest) returns (RetResponse);

	/* entropy source configuration */
	rpc RpcSetPkcs11Config (SetPkcs11ConfigRequest) returns (RetResponse);
}
